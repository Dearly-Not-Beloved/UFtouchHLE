[build]
# the documentation for the touchHLE crate is intended to include private items
# alas this isn't scoped to that crate!
rustdocflags = ["--document-private-items"]

# Align PT_LOAD segments to 16 KB for the Android 64-bit target. Android
# devices that use a 16 KB page size (Android 15+ and the 16 KB emulator)
# reject native libraries whose ELF LOAD segments are only 4 KB aligned.
# This affects libtouchHLE.so and libSDL2.so (both linked by rustc).
# libc++_shared.so is provided by the NDK; see build.gradle.kts (ndkVersion)
# for that one.
[target.aarch64-linux-android]
rustflags = [
    "-C", "link-arg=-Wl,-z,max-page-size=16384",
    "-C", "link-arg=-Wl,-z,common-page-size=16384",
]
